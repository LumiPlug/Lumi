# SPDX-License-Identifier: MPL-2.0
name: Windows Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 / WebView2
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.10.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: windows-acceptance
      - run: pnpm install --frozen-lockfile
      - name: Required checks
        run: pnpm check
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build release application with isolated identity
        run: pnpm tauri:build --no-bundle --ci --config tests/windows/tauri.qa.json
      - name: Install official WebDriver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Match Edge Driver to installed WebView2
        shell: pwsh
        run: ./tests/windows/install-driver.ps1
      - name: Run native Windows acceptance
        run: node tests/windows/acceptance.mjs
      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-acceptance-${{ github.run_attempt }}
          path: reports/windows-acceptance/
          if-no-files-found: warn
          retention-days: 14
